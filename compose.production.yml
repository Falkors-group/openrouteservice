services:
  ors-app:
    image: openrouteservice/openrouteservice:v9.10.0
    container_name: ors-app
    restart: unless-stopped
    volumes:
      - ./graphs:/home/ors/graphs
      - ./config:/home/ors/config
      - ./files:/home/ors/files
      - ./logs:/home/ors/logs
      - ./elevation_cache:/home/ors/elevation_cache
    environment:
      REBUILD_GRAPHS: "False"
      CONTAINER_LOG_LEVEL: INFO
      XMS: 512m
      XMX: 2g
    networks:
      - laravel-production

networks:
  laravel-production:
    external: true
    name: ramble-dashboard-panel_laravel-production
